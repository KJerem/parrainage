name: parrainage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: parrainage
      POSTGRES_PASSWORD: parrainage
      POSTGRES_DB: parrainage
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parrainage -d parrainage"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-devaccess}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-devsecret123}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  # Crée le bucket privé des médias puis s'arrête.
  storage-init:
    image: amazon/aws-cli:2.39.3
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-devaccess}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-devsecret123}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://storage:9000 s3 ls >/dev/null 2>&1; do sleep 2; done
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3 mb "s3://$$BUCKET"
    restart: "no"

  mail:
    image: axllent/mailpit:v1.33.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pg-data:
  rustfs-data:
